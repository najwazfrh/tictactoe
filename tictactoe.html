<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margin Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one notebook page on graph paper — scoreboard strip, the grid drawn in ink, a row of controls. */
:root {
  --paper: #f7f8f3;
  --grid: #d6e0e4;
  --ink: #1f2a44;
  --muted: #5d6b7e;
  --x: #c2410c;
  --o: #1d4ed8;
  --win: #15803d;
  --chip: #ffffff;
  --display: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141b26; --grid: #233042; --ink: #e6ebf2; --muted: #93a1b5;
    --x: #fb923c; --o: #7aa2ff; --win: #4ade80; --chip: #1b2433; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141b26; --grid: #233042; --ink: #e6ebf2; --muted: #93a1b5;
  --x: #fb923c; --o: #7aa2ff; --win: #4ade80; --chip: #1b2433; color-scheme: dark;
}
html, body { min-height: 100%; }
body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.page { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 4px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.4rem; line-height: 1; margin: 0; text-wrap: balance; }
h1 .x { color: var(--x); } h1 .o { color: var(--o); }
.sub { margin: 0; color: var(--muted); font-size: 0.9rem; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--chip); }
.seg button {
  font: 500 0.85rem var(--body); color: var(--ink); background: transparent;
  border: 0; padding: 8px 12px; cursor: pointer;
}
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg[hidden] { display: none !important; }

.score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.tally {
  background: var(--chip); border: 1.5px solid var(--grid); border-radius: 10px;
  padding: 8px 12px; display: flex; justify-content: space-between; align-items: baseline;
  transition: border-color .2s;
}
.tally.active { border-color: currentColor; }
.tally.tx { color: var(--x); } .tally.to { color: var(--o); }
.tally .who { font-family: var(--display); font-size: 1.15rem; }
.tally .n { font: 500 1.4rem var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.draws { align-self: center; text-align: center; font: 400 0.75rem var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.draws b { display: block; font-size: 1.1rem; color: var(--ink); font-weight: 500; }

.status { font-family: var(--display); font-size: 1.5rem; min-height: 2.2rem; margin: 0; text-align: center; }
.status .x { color: var(--x); } .status .o { color: var(--o); } .status .w { color: var(--win); }

.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; }
.board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.cell {
  background: transparent; border: 0; padding: 10%; cursor: pointer; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; color: var(--ink);
}
.cell:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.cell:focus-visible { outline: 2.5px dashed var(--ink); outline-offset: -6px; }
.cell:disabled { cursor: default; }
.cell svg { width: 100%; height: 100%; overflow: visible; }
.mark { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.mark.x { stroke: var(--x); } .mark.o { stroke: var(--o); }
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: ink .28s ease-out forwards; }
.draw.second { animation-delay: .18s; }
@keyframes ink { to { stroke-dashoffset: 0; } }
.lines, .strike { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.lines path { stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; }
.strike line { stroke: var(--win); stroke-width: 7; stroke-linecap: round; fill: none; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: 600 0.9rem var(--body); padding: 10px 16px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper);
}
.btn.ghost { background: var(--chip); color: var(--ink); }
.btn:focus-visible, .seg button:focus-visible { outline: 2.5px solid var(--o); outline-offset: 2px; }
.hint { font: 400 0.75rem var(--mono); color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1><span class="x">X</span>s &amp; <span class="o">O</span>s</h1>
    <p class="sub">Three in a row wins. Play a friend on this screen, or take on the computer.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Opponent">
      <button id="mode-cpu" type="button" aria-pressed="true">vs Computer</button>
      <button id="mode-pvp" type="button" aria-pressed="false">2 Players</button>
    </div>
    <div class="seg" id="level" role="group" aria-label="Difficulty">
      <button id="lvl-easy" type="button" aria-pressed="false">Easy</button>
      <button id="lvl-hard" type="button" aria-pressed="true">Unbeatable</button>
    </div>
  </div>

  <div class="score" aria-live="polite">
    <div class="tally tx" id="tally-x"><span class="who" id="name-x">You · X</span><span class="n" id="score-x">0</span></div>
    <div class="draws">Draws<b id="score-d">0</b></div>
    <div class="tally to" id="tally-o"><span class="who" id="name-o">CPU · O</span><span class="n" id="score-o">0</span></div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="board-wrap">
    <svg class="lines" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M101 8 C99 90 103 200 100 292"></path>
      <path d="M200 6 C202 110 198 210 201 294"></path>
      <path d="M8 100 C90 102 210 98 292 101"></path>
      <path d="M6 199 C110 201 200 197 294 200"></path>
    </svg>
    <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>
    <svg class="strike" id="strike" viewBox="0 0 300 300" aria-hidden="true"></svg>
  </div>

  <div class="actions">
    <button class="btn" id="new-round" type="button">New round</button>
    <button class="btn ghost" id="reset" type="button">Reset scores</button>
  </div>
  <p class="hint">Tip: use Tab and Enter to play with the keyboard. X and O swap who starts each round.</p>
</div>

<script>
(function () {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), strikeEl = $('strike'), statusEl = $('status');

  let state = { mode: 'cpu', level: 'hard', scores: { X: 0, O: 0, D: 0 }, starter: 'X' };
  try { const s = JSON.parse(localStorage.getItem('ttt-state')); if (s && s.scores) state = Object.assign(state, s); } catch (e) {}
  const save = () => { try { localStorage.setItem('ttt-state', JSON.stringify(state)); } catch (e) {} };

  let board, turn, over, busy;

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell'; b.type = 'button'; b.id = 'cell-' + i;
    b.addEventListener('click', () => humanMove(i));
    boardEl.appendChild(b); cells.push(b);
  }

  function winner(bd) {
    for (const l of LINES) { const [a,b,c] = l; if (bd[a] && bd[a] === bd[b] && bd[a] === bd[c]) return { p: bd[a], line: l }; }
    return bd.every(Boolean) ? { p: 'D' } : null;
  }

  function markSVG(p) {
    if (p === 'X') return '<svg viewBox="0 0 100 100"><path class="mark x draw" style="--len:110" d="M18 20 C40 42 60 60 82 82"/><path class="mark x draw second" style="--len:110" d="M80 18 C58 42 42 60 20 82"/></svg>';
    return '<svg viewBox="0 0 100 100"><path class="mark o draw" style="--len:230" d="M52 14 C78 13 88 34 86 52 C84 74 66 87 48 86 C27 85 14 68 15 49 C16 30 30 16 54 18"/></svg>';
  }

  function render() {
    cells.forEach((c, i) => {
      const filled = !!board[i];
      if (filled && !c.dataset.p) { c.innerHTML = markSVG(board[i]); c.dataset.p = board[i]; }
      if (!filled) { c.innerHTML = ''; delete c.dataset.p; }
      c.disabled = filled || over || busy;
      c.setAttribute('aria-label', 'Row ' + (Math.floor(i/3)+1) + ', column ' + (i%3+1) + ': ' + (board[i] || 'empty'));
    });
    $('score-x').textContent = state.scores.X;
    $('score-o').textContent = state.scores.O;
    $('score-d').textContent = state.scores.D;
    const cpu = state.mode === 'cpu';
    $('name-x').textContent = cpu ? 'You · X' : 'Player X';
    $('name-o').textContent = cpu ? 'CPU · O' : 'Player O';
    $('tally-x').classList.toggle('active', !over && turn === 'X');
    $('tally-o').classList.toggle('active', !over && turn === 'O');
    $('mode-cpu').setAttribute('aria-pressed', cpu);
    $('mode-pvp').setAttribute('aria-pressed', !cpu);
    $('level').hidden = !cpu;
    $('lvl-easy').setAttribute('aria-pressed', state.level === 'easy');
    $('lvl-hard').setAttribute('aria-pressed', state.level === 'hard');
  }

  function setStatus() {
    const w = winner(board);
    const cpu = state.mode === 'cpu';
    if (w && w.p === 'D') statusEl.innerHTML = 'Cat’s game. It’s a draw.';
    else if (w) statusEl.innerHTML = cpu
      ? (w.p === 'X' ? '<span class="w">You win!</span>' : '<span class="o">The computer wins.</span>')
      : '<span class="' + w.p.toLowerCase() + '">' + w.p + '</span> wins!';
    else if (cpu) statusEl.innerHTML = turn === 'X' ? 'Your move, <span class="x">X</span>' : '<span class="o">Computer</span> is thinking…';
    else statusEl.innerHTML = '<span class="' + turn.toLowerCase() + '">' + turn + '</span> to move';
  }

  function drawStrike(line) {
    const c = i => [ (i % 3) * 100 + 50, Math.floor(i / 3) * 100 + 50 ];
    let [x1, y1] = c(line[0]), [x2, y2] = c(line[2]);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ext = 34;
    x1 -= dx / len * ext; y1 -= dy / len * ext; x2 += dx / len * ext; y2 += dy / len * ext;
    const L = Math.round(len + 2 * ext);
    strikeEl.innerHTML = '<line class="draw" style="--len:' + L + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
  }

  function place(i) {
    board[i] = turn;
    const w = winner(board);
    if (w) {
      over = true;
      state.scores[w.p] += 1; save();
      if (w.line) drawStrike(w.line);
    } else turn = turn === 'X' ? 'O' : 'X';
    render(); setStatus();
  }

  function humanMove(i) {
    if (over || busy || board[i]) return;
    if (state.mode === 'cpu' && turn !== 'X') return;
    place(i);
    maybeCpu();
  }

  function maybeCpu() {
    if (state.mode !== 'cpu' || over || turn !== 'O') return;
    busy = true; render(); setStatus();
    setTimeout(() => { busy = false; place(cpuPick()); }, 450);
  }

  function minimax(bd, player, depth) {
    const w = winner(bd);
    if (w) return w.p === 'O' ? 10 - depth : w.p === 'X' ? depth - 10 : 0;
    let best = player === 'O' ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) if (!bd[i]) {
      bd[i] = player;
      const s = minimax(bd, player === 'O' ? 'X' : 'O', depth + 1);
      bd[i] = null;
      best = player === 'O' ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  function cpuPick() {
    const open = board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    if (state.level === 'easy' && Math.random() < 0.6) return open[Math.floor(Math.random() * open.length)];
    let best = -Infinity, picks = [];
    for (const i of open) {
      board[i] = 'O'; const s = minimax(board, 'X', 1); board[i] = null;
      if (s > best) { best = s; picks = [i]; } else if (s === best) picks.push(i);
    }
    return picks[Math.floor(Math.random() * picks.length)];
  }

  function newRound(swap) {
    if (swap) state.starter = state.starter === 'X' ? 'O' : 'X';
    save();
    board = Array(9).fill(null); turn = state.starter; over = false; busy = false;
    strikeEl.innerHTML = '';
    render(); setStatus(); maybeCpu();
  }

  $('new-round').addEventListener('click', () => newRound(true));
  $('reset').addEventListener('click', () => { state.scores = { X: 0, O: 0, D: 0 }; state.starter = 'X'; newRound(false); });
  $('mode-cpu').addEventListener('click', () => { if (state.mode !== 'cpu') { state.mode = 'cpu'; state.scores = { X: 0, O: 0, D: 0 }; state.starter = 'X'; newRound(false); } });
  $('mode-pvp').addEventListener('click', () => { if (state.mode !== 'pvp') { state.mode = 'pvp'; state.scores = { X: 0, O: 0, D: 0 }; state.starter = 'X'; newRound(false); } });
  $('lvl-easy').addEventListener('click', () => { state.level = 'easy'; save(); render(); });
  $('lvl-hard').addEventListener('click', () => { state.level = 'hard'; save(); render(); });

  newRound(false);
})();
</script>
</body>
</html>
